name: Feature request
description: Propose a scoped Foundation Math improvement.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: 'Use synthetic examples and remove private data. Follow SECURITY.md for sensitive reports.'
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Explain the unmet need and what existing commands or contracts you tried.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and scope
      description: Describe the affected component, inputs, outputs, assumptions, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and limits
      description: Propose bounded synthetic checks and distinguish software checks from mathematical or physical validation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: input
    id: version
    attributes:
      label: Current commit
      description: The commit or source candidate you are working with.
  - type: textarea
    id: affected
    attributes:
      label: Affected requirements, interfaces and documents
      description: Requirement IDs (REQ-MATH-###), ICDs, data dictionary entries and guides. Name other family repositories affected by an interface change.
  - type: dropdown
    id: priority
    attributes:
      label: Priority (your assessment)
      options:
        - high
        - medium
        - low
  - type: markdown
    attributes:
      value: 'Maintainer record: the implementing pull request states the disposition (approved, rejected or deferred), the impact analysis, the verifying tests and matrix rows, and the commit or candidate that contains the change.'
